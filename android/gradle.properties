org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation — there's a known Kotlin bug
# when source files and the project live on different drive letters
# (e.g. pub cache on C: and project on D:) that breaks incremental caches.
kotlin.incremental=false
