name: campus_lost_found
description: Campus Lost & Found Board — P08 Flutter Final Project
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  google_maps_flutter: ^2.5.0
  # OpenStreetMap-based map widget. Works in regions where Google Maps
  # tile coverage is poor (e.g. Northern Cyprus), needs no API key, and
  # bypasses the Maps SDK lite-mode / certificate issues.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.2

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  cloud_functions: ^4.7.0

  # State Management
  provider: ^6.1.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Image Picker
  image_picker: ^1.0.7
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.3
  connectivity_plus: ^5.0.2
  geolocator: ^12.0.0
  url_launcher: ^6.3.2
  share_plus: ^7.2.2
  encrypt: ^5.0.3
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/png/
    - assets/logo/svg/

# App icon generation config.
# Run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/png/icon-app-solid-1024.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/logo/android/ic_launcher_foreground.png"
  min_sdk_android: 21
